# Gate command registry (project-owned; copy/update after bootstrap)
#
# Commands are executed from the project repository root by
# .context_ledger/core/bin/ledger-gates. Keep secrets out of this file.
#
# mode=hybrid means explicit commands below run first; when a gate has no
# explicit project commands, the helper discovers conventional package.json
# scripts or Python checks. Set mode=explicit to fail when a gate has no
# configured project command.
mode=hybrid

# One command per line: <gate>|<command>  (run from the repo root)
# Gates: checkpoint, pre-commit, integration, exit
#
# GVI has two independent packages (web/, server/) and no test suite yet, so
# the quality signal is type-check + build. web's `tsc -b` catches what the
# laxer `tsc --noEmit` misses (e.g. noUnusedLocals) — it is the real gate.

# Before committing: both packages must type-check.
pre-commit|cd web && npx tsc -b
pre-commit|cd server && npx tsc --noEmit

# Before merging: the production build must succeed.
integration|cd web && npm run build

# At session exit: full build + server type-check must be green.
exit|cd web && npm run build
exit|cd server && npx tsc --noEmit
