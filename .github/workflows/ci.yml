name: CI

# The gate: a change must type-check and build before it can merge, and main
# is re-checked on every push. Branches are merged/deleted only on green.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: web — type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc -b (type-check, incl. noUnusedLocals) && vite build

  server:
    name: server — type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
